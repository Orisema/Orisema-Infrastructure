name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Verify release packaging
        env:
          VERSION: v0.1.0-test.1
          COMMIT: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/orisema-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          scripts/build-release.sh
          scripts/verify-release.sh
  podman-healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman openssh-server
          sudo podman version
      - name: Build and check with Go 1.23
        run: |
          go version
          go vet ./...
          go test ./...
          mkdir -p work
          go build -o work/orisema ./cmd/orisema
          go test -c -o work/planner.test ./internal/planner
      - name: Deploy isolated healthcheck and verify real inspect
        run: |
          set -euo pipefail
          work/orisema validate examples/nginx-health.yaml
          sudo work/orisema plan examples/nginx-health.yaml | tee work/plan-before.txt
          grep -q CREATE work/plan-before.txt
          printf 'DEPLOY\n' | sudo work/orisema deploy examples/nginx-health.yaml
          sudo work/orisema status examples/nginx-health.yaml
          sudo podman healthcheck run orisema-health-lab-web
          sudo work/orisema status examples/nginx-health.yaml | tee work/status-after-probe.txt
          grep -q "health: healthy" work/status-after-probe.txt
          sudo podman inspect orisema-health-lab-web > work/inspect-after-probe.json
          sudo work/orisema plan examples/nginx-health.yaml | tee work/plan-after.txt
          grep -q NOOP work/plan-after.txt
          sudo env ORISEMA_TEST_HEALTH_MANIFEST="$PWD/examples/nginx-health.yaml" work/planner.test -test.v -test.run TestPodmanHealthcheckIntegrationReadOnly
      - name: Verify scheduled probes
        run: |
          set -euo pipefail
          sleep 40
          sudo podman inspect orisema-health-lab-web > work/inspect-scheduled.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          def logs(path):
              state = json.loads(Path(path).read_text())[0]['State']
              health = state.get('Healthcheck') or state.get('Health') or {}
              return health.get('Log') or []
          before = logs('work/inspect-after-probe.json')
          after = logs('work/inspect-scheduled.json')
          assert before, 'manual probe produced no health log'
          assert after and after[-1]['Start'] != before[-1]['Start'], 'no subsequent scheduled probe observed'
          assert after[-1]['ExitCode'] == 0, after[-1]
          print('Observed successful scheduled probe:', after[-1]['Start'])
          item = json.loads(Path('work/inspect-scheduled.json').read_text())[0]
          fixture = {'Config': {'Healthcheck': item['Config']['Healthcheck']},
                     'State': {key: value for key, value in item['State'].items()
                               if key in ('Running', 'Status', 'Health', 'Healthcheck')}}
          for key in ('Health', 'Healthcheck'):
              if key in fixture['State']:
                  fixture['State'][key] = {'Status': fixture['State'][key]['Status']}
          print('INSPECT_HEALTH_FIXTURE=' + json.dumps(fixture))
          PY
      - name: Verify stopped containers do not report healthy
        run: |
          set -euo pipefail
          printf 'STOP\n' | sudo work/orisema stop examples/nginx-health.yaml web
          sudo work/orisema status examples/nginx-health.yaml | tee work/status-stopped.txt
          grep -Fq 'health: unavailable (container not running)' work/status-stopped.txt
          sudo work/orisema plan examples/nginx-health.yaml | tee work/plan-stopped.txt
          grep -q NOOP work/plan-stopped.txt
      - name: Exercise prepared recovery and verification
        run: |
          set -euo pipefail
          history="$PWD/work/recovery.jsonl"
          sudo work/orisema recover init examples/nginx-health.yaml \
            --history "$history" --operator ci
          sudo work/orisema recover prepare examples/nginx-health.yaml web \
            --history "$history" --operator ci --reason "isolated integration test" \
            | tee work/recovery-prepare.txt
          token="$(awk '/^Reservation token: / { print $3 }' work/recovery-prepare.txt)"
          test "${#token}" -eq 32
          printf 'APPLY START web\n' | sudo work/orisema recover apply \
            examples/nginx-health.yaml web --history "$history" --token "$token"
          sudo podman healthcheck run orisema-health-lab-web
          sudo work/orisema recover verify examples/nginx-health.yaml web \
            --history "$history" --token "$token"
          sudo work/orisema recover history examples/nginx-health.yaml \
            --history "$history" | tee work/recovery-history.txt
          grep -Fq 'status=start-command-succeeded' work/recovery-history.txt
          grep -Fq 'observation=healthy' work/recovery-history.txt
          sudo chown "$USER":"$(id -gn)" "$history"
      - name: Exercise fail-closed negative regressions
        run: |
          set -euo pipefail
          sudo env \
            ORISEMA_BINARY="$PWD/work/orisema" \
            ORISEMA_EVIDENCE_DIR="$PWD/work/alpha1-negative" \
            scripts/alpha1-negative-regressions.sh
          sudo chown -R "$USER":"$(id -gn)" work/alpha1-negative
      - name: Exercise recovery concurrency under the race detector
        run: |
          go test -race ./internal/recovery \
            -run 'Test(BeginConcurrentSingleWinner|PrepareConcurrentSingleWinner|ConsumedTokenCannotBeReused)'
      - name: Exercise Alpha 2 manifest contract
        run: |
          set -euo pipefail
          sudo env \
            ORISEMA_BINARY="$PWD/work/orisema" \
            ORISEMA_EVIDENCE_DIR="$PWD/work/alpha2-contract" \
            scripts/alpha2-contract-regressions.sh
          sudo chown -R "$USER":"$(id -gn)" work/alpha2-contract
      - name: Exercise Alpha 3 update and rollback laboratory
        run: |
          set -euo pipefail
          printf 'UPDATE web\n' | sudo env \
            ORISEMA_EVIDENCE_DIR="$PWD/work/alpha3-update" \
            scripts/alpha3-update-lab.sh
          sudo chown -R "$USER":"$(id -gn)" work/alpha3-update
      - name: Exercise Alpha 5 preserved update application
        run: |
          set -euo pipefail
          sudo env \
            ORISEMA_BINARY="$PWD/work/orisema" \
            ORISEMA_EVIDENCE_DIR="$PWD/work/alpha5-update-apply" \
            scripts/alpha5-update-apply-lab.sh
          sudo env \
            ORISEMA_BINARY="$PWD/work/orisema" \
            ORISEMA_EVIDENCE_DIR="$PWD/work/alpha5-update-health-failure" \
            ORISEMA_HEALTH_COMMAND=false \
            ORISEMA_EXPECT_DECISION=RECOVERY_REQUIRED \
            scripts/alpha5-update-apply-lab.sh
          sudo env \
            ORISEMA_BINARY="$PWD/work/orisema" \
            ORISEMA_EVIDENCE_DIR="$PWD/work/alpha5-manual-rollback" \
            ORISEMA_EXPECT_DECISION=RECOVERY_REQUIRED \
            ORISEMA_FORCE_CANDIDATE_STOP=true \
            ORISEMA_ROLLBACK_AFTER_FAILURE=true \
            scripts/alpha5-update-apply-lab.sh
          sudo chown -R "$USER":"$(id -gn)" work/alpha5-update-apply
          sudo chown -R "$USER":"$(id -gn)" work/alpha5-update-health-failure
          sudo chown -R "$USER":"$(id -gn)" work/alpha5-manual-rollback
      - name: Exercise Phase 2 backup and restore laboratory
        run: |
          set -euo pipefail
          sudo env \
            ORISEMA_BINARY="$PWD/work/orisema" \
            ORISEMA_EVIDENCE_DIR="$PWD/work/phase2-backup-restore" \
            scripts/phase2-backup-restore-lab.sh
          sudo chown -R "$USER":"$(id -gn)" work/phase2-backup-restore
      - name: Exercise Phase 2 strict SSH transport laboratory
        run: |
          set -euo pipefail
          sudo env \
            ORISEMA_BINARY="$PWD/work/orisema" \
            ORISEMA_EVIDENCE_DIR="$PWD/work/phase2-ssh-transport" \
            ORISEMA_SSH_USER="$USER" \
            scripts/phase2-ssh-transport-lab.sh
          sudo chown -R "$USER":"$(id -gn)" work/phase2-ssh-transport
      - name: Save laboratory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: podman-healthcheck-evidence
          path: |
            work/*.json
            work/*.jsonl
            work/*.txt
            work/alpha1-negative/*.txt
            work/alpha2-contract/*.txt
            work/alpha3-update/*.json
            work/alpha3-update/*.txt
            work/alpha5-update-apply/*.json
            work/alpha5-update-apply/*.txt
            work/alpha5-update-health-failure/*.json
            work/alpha5-update-health-failure/*.txt
            work/alpha5-manual-rollback/*.json
            work/alpha5-manual-rollback/*.txt
            work/phase2-backup-restore/*.json
            work/phase2-backup-restore/*.txt
            work/phase2-ssh-transport/*.txt
            work/phase2-ssh-transport/*.log
  quickstart-matrix:
    name: quickstart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Podman and record environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          mkdir -p work
          cat /etc/os-release | tee work/os-release.txt
          uname -srm | tee work/kernel.txt
          sudo podman version | tee work/podman-version.txt
      - name: Reproduce documented quick start
        run: |
          set -euo pipefail
          go build -o work/orisema ./cmd/orisema
          work/orisema version | tee work/orisema-version.txt
          work/orisema validate examples/nginx.yaml
          sudo work/orisema plan examples/nginx.yaml | tee work/plan-before.txt
          grep -Fq '[CREATE]' work/plan-before.txt
          printf 'DEPLOY\n' | sudo work/orisema deploy examples/nginx.yaml
          sudo work/orisema status examples/nginx.yaml | tee work/status.txt
          sudo work/orisema plan examples/nginx.yaml | tee work/plan-after.txt
          grep -Fq '[NOOP]' work/plan-after.txt
          curl --fail --head --retry 5 --retry-delay 1 http://127.0.0.1:8080/ \
            | tee work/http-head.txt
          sudo work/orisema logs examples/nginx.yaml web | tee work/logs.txt
          test "$(sudo podman inspect --format '{{ index .Config.Labels "dev.orisema.managed" }}' orisema-hello-orisema-web)" = true
          test "$(sudo podman inspect --format '{{ index .Config.Labels "dev.orisema.app" }}' orisema-hello-orisema-web)" = hello-orisema
          test "$(sudo podman inspect --format '{{ index .Config.Labels "dev.orisema.service" }}' orisema-hello-orisema-web)" = web
      - name: Remove only the isolated quick-start container
        if: always()
        run: sudo podman rm --force orisema-hello-orisema-web || true
      - name: Save compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.os }}
          path: work/*.txt
