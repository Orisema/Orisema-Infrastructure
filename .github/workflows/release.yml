name: Release binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  issues:
    types: [closed]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.event_name == 'push' || contains(fromJSON('[14, 27, 28, 46, 73, 89, 102, 121, 124]'), github.event.issue.number)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || github.event.issue.number == 27 && 'v0.1.0-alpha.2' || github.event.issue.number == 28 && 'v0.1.0-alpha.3' || github.event.issue.number == 46 && 'v0.1.0-alpha.4' || github.event.issue.number == 73 && 'v0.1.0-alpha.5' || github.event.issue.number == 89 && 'v0.1.0-alpha.6' || github.event.issue.number == 102 && 'v0.1.0-alpha.7' || github.event.issue.number == 121 && 'v0.1.0-alpha.8' || github.event.issue.number == 124 && 'v0.1.0-alpha.9' || 'v0.1.0-alpha.1' }}
      COMMIT: ${{ github.event_name == 'push' && github.sha || github.event.issue.number == 27 && 'a33e930025247e801c2b57799a8c77aa821e8e3e' || github.sha }}
      CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: ${{ env.COMMIT }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Create the Alpha tag after its gate issue closes
        if: github.event_name == 'issues'
        run: |
          set -euo pipefail
          case '${{ github.event.issue.number }}' in
            14) test "$VERSION" = v0.1.0-alpha.1 ;;
            27) test "$VERSION" = v0.1.0-alpha.2 ;;
            28) test "$VERSION" = v0.1.0-alpha.3 ;;
            46) test "$VERSION" = v0.1.0-alpha.4 ;;
            73) test "$VERSION" = v0.1.0-alpha.5 ;;
            89) test "$VERSION" = v0.1.0-alpha.6 ;;
            102) test "$VERSION" = v0.1.0-alpha.7 ;;
            121) test "$VERSION" = v0.1.0-alpha.8 ;;
            124) test "$VERSION" = v0.1.0-alpha.9 ;;
            *) exit 1 ;;
          esac
          existing="$(git ls-remote --refs origin "refs/tags/$VERSION" \
            | awk '{print $1}')"
          if [ -n "$existing" ]; then
            test "$existing" = "$COMMIT"
          else
            git tag "$VERSION" "$COMMIT"
            git push origin "refs/tags/$VERSION"
          fi
      - name: Validate release source and tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" \
            --jq '.object.sha')" = "$COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test source
        run: |
          go mod download
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Build and verify release archives
        run: |
          scripts/build-release.sh
          scripts/verify-release.sh
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/orisema_linux_*.tar.gz
      - name: Attest checksum metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/checksums.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and verify checksum metadata
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$CERTIFICATE_IDENTITY"
      - name: Publish GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist/orisema_linux_amd64.tar.gz
            dist/orisema_linux_arm64.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          )
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "Orisema Infrastructure $VERSION"
          fi
      - name: Verify installation from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$install_dir"
          cd "$install_dir"
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$CERTIFICATE_IDENTITY"
          sha256sum --check checksums.txt
          gh attestation verify checksums.txt --repo "$GITHUB_REPOSITORY"
          gh attestation verify orisema_linux_amd64.tar.gz --repo "$GITHUB_REPOSITORY"
          gh attestation verify orisema_linux_arm64.tar.gz --repo "$GITHUB_REPOSITORY"
          tar -xzf orisema_linux_amd64.tar.gz
          ./orisema version | tee installed-version.txt
          grep -Fq "Version: $VERSION" installed-version.txt
          grep -Fq "Commit: $COMMIT" installed-version.txt
          sh "$GITHUB_WORKSPACE/install.sh" \
            --version "$VERSION" \
            --bin-dir "$install_dir/bin"
          "$install_dir/bin/orisema" version | tee installer-version.txt
          grep -Fq "Version: $VERSION" installer-version.txt
          grep -Fq "Commit: $COMMIT" installer-version.txt
          HOME="$install_dir/home" XDG_BIN_HOME="$install_dir/bin" \
            sh "$GITHUB_WORKSPACE/uninstall.sh" --user
          test ! -e "$install_dir/bin/orisema"
