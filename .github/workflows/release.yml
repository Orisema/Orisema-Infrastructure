name: Release binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate tag points at this checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Test source
        run: |
          go mod download
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Build and verify release archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          scripts/build-release.sh
          scripts/verify-release.sh
      - name: Publish GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/orisema_linux_amd64.tar.gz \
            dist/orisema_linux_arm64.tar.gz \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "Orisema Infrastructure $GITHUB_REF_NAME"
      - name: Verify installation from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$install_dir"
          cd "$install_dir"
          sha256sum --check checksums.txt
          tar -xzf orisema_linux_amd64.tar.gz
          ./orisema version | tee installed-version.txt
          grep -Fq "Version: $GITHUB_REF_NAME" installed-version.txt
          grep -Fq "Commit: $GITHUB_SHA" installed-version.txt
