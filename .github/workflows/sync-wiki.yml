name: Sync documentation to Wiki

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "docs/**"
      - "scripts/sync_wiki.py"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone wiki
        env:
          GH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Set WIKI_PUSH_TOKEN (fine-grained token with Contents: read/write on this repository)."; exit 1; }
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$HEADER" clone "https://github.com/${{ github.repository }}.wiki.git" /tmp/orisema-wiki
      - name: Generate wiki pages and navigation
        run: python3 scripts/sync_wiki.py /tmp/orisema-wiki
      - name: Publish changes
        working-directory: /tmp/orisema-wiki
        env:
          GH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "docs: sync wiki from main"
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$HEADER" push origin HEAD
