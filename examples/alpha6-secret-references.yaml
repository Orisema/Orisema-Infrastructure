apiVersion: orisema.dev/v1alpha3
kind: Application
name: alpha6-secrets-lab
secrets:
  - name: example-token
    source:
      podman:
        name: alpha6-example-token
services:
  - name: web
    image: docker.io/library/nginx:1.27-alpine
    secrets:
      - name: example-token
        target: example-token
